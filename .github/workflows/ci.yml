name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app (includes its TypeScript check)
        run: npm run build

      - name: Typecheck backend package
        run: npx tsc --noEmit -p backend/tsconfig.json

      - name: Typecheck infra package
        run: npx tsc --noEmit -p infra/tsconfig.json

      - name: Lint
        run: npm run lint

      # Pure logic-level tests only (frontend record-kind composition checks
      # + backend permission/lifecycle/restore tests against the in-memory
      # fake). No AWS credentials used or required — see
      # docs/backend/evidence-matrix.md for what this does and doesn't prove.
      - name: Test
        run: npm test

      # Reads the production build written by the Build step (.next): no
      # private archive material in client bundles or prerendered pages,
      # the authority scenario at exactly its expected routes, and noindex
      # on every synthetic record page. No network, no credentials.
      - name: Verify disclosure boundary in the production build
        run: npm run verify:disclosure

      # Flight Deck operations store against a real PostgreSQL 17, started
      # from the embedded-postgres dev dependency in a temporary directory
      # on the runner. Synthetic data only; nothing outlives the step. No
      # credentials, no network services.
      - name: Flight Deck PostgreSQL integration tests
        run: npm run test:flight-deck-pg

      # Synth only — proves the CDK stack produces valid CloudFormation in
      # environment-agnostic mode. Does NOT deploy, and needs no credentials.
      - name: CDK synth (no deploy, no credentials)
        working-directory: infra
        run: npx cdk synth

  # Milestone 3.0, Phase 4 (decision 58): the Flight Deck protected boundary
  # (docs/design/milestone-3.0-phase-4-flight-deck.md). A separate job, so
  # build-lint-test is unchanged. The checker is taken from the merge base
  # when the base has one, so a branch cannot weaken the check it is judged
  # by; its exceptions are read from the base too. On pull requests, phase-4/*
  # branches fail on any protected change, and other branches fail on a
  # structural change to Flight Deck files. On pushes to main it reports only.
  flight-deck-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history, for the merge base)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Boundary checker and census self-tests
        run: node --test scripts/test/flight-deck-boundary.test.mjs scripts/test/flight-deck-census.test.mjs

      - name: Flight Deck protected boundary
        env:
          BOUNDARY_BRANCH: ${{ github.head_ref || github.ref_name }}
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD^1' }}
          MODE: ${{ github.event_name == 'pull_request' && 'auto' || 'report' }}
        run: |
          BASE_SHA=$(git merge-base "$BASE_REF" HEAD)
          if git cat-file -e "$BASE_SHA:scripts/test/flight-deck-boundary.mjs" 2>/dev/null; then
            git show "$BASE_SHA:scripts/test/flight-deck-boundary.mjs" > "$RUNNER_TEMP/flight-deck-boundary.mjs"
            echo "Checker taken from the merge base ($BASE_SHA)."
            node "$RUNNER_TEMP/flight-deck-boundary.mjs" --base "$BASE_REF" --branch "$BOUNDARY_BRANCH" --mode "$MODE"
          else
            echo "The merge base has no checker (the PR that introduces it): using this branch's copy."
            node scripts/test/flight-deck-boundary.mjs --base "$BASE_REF" --branch "$BOUNDARY_BRANCH" --mode "$MODE"
          fi
